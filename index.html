<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Adventure</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;600;700&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #243b55, #101525 75%);
    font-family: 'Poppins', sans-serif;
    color: white;
    padding: 20px;
}

.game-container {
    width: min(100%, 540px);
    text-align: center;
}

h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(25px, 7vw, 38px);
    color: #55f7b5;
    text-shadow: 0 0 15px #00ffae;
    margin-bottom: 8px;
}

.subtitle {
    color: #a9b8d0;
    font-size: 13px;
    margin-bottom: 20px;
}

.score-panel {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
}

.score-box {
    flex: 1;
    padding: 12px 5px;
    background: #1c2941;
    border: 1px solid #354a68;
    border-radius: 12px;
}

.score-label {
    font-size: 11px;
    color: #a9b8d0;
    letter-spacing: 1px;
}

.score-number {
    font-family: 'Orbitron', sans-serif;
    font-size: 23px;
    margin-top: 5px;
}

#score {
    color: #55f7b5;
}

#points {
    color: #ffca55;
}

#best {
    color: #b99cff;
}

.board-frame {
    background: #263b42;
    border: 7px solid #3d6960;
    border-radius: 15px;
    padding: 5px;
    box-shadow: 0 0 25px rgba(0,255,170,0.2);
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #142b2a;
    border-radius: 5px;
}

.buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
}

button {
    border: none;
    padding: 11px 20px;
    border-radius: 9px;
    background: #263b55;
    color: white;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
    filter: brightness(1.2);
}

.start-btn {
    background: #00c98d;
    color: #102b26;
}

.pause-btn {
    background: #e5a83b;
    color: #201a0e;
}

.restart-btn {
    background: #a66cff;
}

.controls {
    display: grid;
    grid-template-columns: repeat(3, 48px);
    justify-content: center;
    gap: 7px;
    margin-top: 18px;
}

.controls button {
    padding: 10px;
    font-size: 20px;
    background: #293b55;
    touch-action: manipulation;
}

.controls .empty {
    visibility: hidden;
}

.help {
    color: #a9b8d0;
    font-size: 12px;
    margin-top: 15px;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 10, 20, 0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 10;
}

.overlay.hidden {
    display: none;
}

.overlay-content {
    width: min(100%, 350px);
    padding: 30px 20px;
    background: #1c2941;
    border: 2px solid #55f7b5;
    border-radius: 18px;
    box-shadow: 0 0 30px rgba(85,247,181,0.2);
}

.overlay-content h2 {
    font-family: 'Orbitron', sans-serif;
    color: #55f7b5;
    font-size: 27px;
}

.overlay-content p {
    color: #c1cce0;
    font-size: 14px;
}

@media (max-width: 400px) {
    .score-number {
        font-size: 19px;
    }

    button {
        padding: 10px 14px;
    }
}
</style>
</head>

<body>

<div class="game-container">

    <h1>🐍 SNAKE ADVENTURE</h1>
    <div class="subtitle">Eat • Grow • Survive</div>

    <div class="score-panel">

        <div class="score-box">
            <div class="score-label">SCORE</div>
            <div class="score-number" id="score">0</div>
        </div>

        <div class="score-box">
            <div class="score-label">POINTS</div>
            <div class="score-number" id="points">0</div>
        </div>

        <div class="score-box">
            <div class="score-label">BEST</div>
            <div class="score-number" id="best">0</div>
        </div>

    </div>

    <div class="board-frame">
        <canvas id="game" width="480" height="480"></canvas>
    </div>

    <div class="buttons">

        <button class="start-btn" id="startBtn">
            ▶ START
        </button>

        <button class="pause-btn" id="pauseBtn">
            ⏸ PAUSE
        </button>

        <button class="restart-btn" id="restartBtn">
            ↻ RESTART
        </button>

    </div>

    <div class="controls">

        <button class="empty"> </button>
        <button data-dir="up">⬆️</button>
        <button class="empty"> </button>

        <button data-dir="left">⬅️</button>
        <button data-dir="down">⬇️</button>
        <button data-dir="right">➡️</button>

    </div>

    <div class="help">
        Use ARROW KEYS or WASD to control the snake.
    </div>

</div>


<!-- START AND GAME OVER WINDOW -->

<div class="overlay" id="overlay">

    <div class="overlay-content">

        <h2 id="overlayTitle">SNAKE ADVENTURE</h2>

        <p id="overlayText">
            Welcome! Get ready for an adventure.
        </p>

        <button class="start-btn" id="overlayBtn">
            START GAME
        </button>

    </div>

</div>


<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const pointsElement = document.getElementById("points");
const bestElement = document.getElementById("best");

const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");
const overlayBtn = document.getElementById("overlayBtn");

const CELL = 20;
const SIZE = 24;

let snake;
let direction;
let nextDirection;
let food;
let score = 0;
let points = 0;
let best = Number(localStorage.getItem("snakeBest")) || 0;

let gameRunning = false;
let gameOver = false;
let timer = null;
let speed = 130;

bestElement.textContent = best;


// SNAKE HEAD IMAGE

const headImage = new Image();

const headSVG = `
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
<defs>
<linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#a5ff75"/>
<stop offset="100%" stop-color="#20b86b"/>
</linearGradient>
</defs>

<rect x="8" y="12" width="84" height="76" rx="38" fill="url(#green)" stroke="#126d48" stroke-width="5"/>

<ellipse cx="35" cy="37" rx="11" ry="14" fill="white"/>
<ellipse cx="68" cy="37" rx="11" ry="14" fill="white"/>

<circle cx="38" cy="39" r="6" fill="#102b25"/>
<circle cx="65" cy="39" r="6" fill="#102b25"/>

<circle cx="40" cy="37" r="2" fill="white"/>
<circle cx="67" cy="37" r="2" fill="white"/>

<path d="M37 67 Q50 78 65 67" fill="none" stroke="#126d48" stroke-width="4" stroke-linecap="round"/>

<path d="M49 70 Q43 85 50 92 Q57 85 51 70" fill="#ff526d"/>
</svg>
`;

headImage.src =
"data:image/svg+xml;charset=utf-8," +
encodeURIComponent(headSVG);


// RANDOM FOOD PICTURES

const foodPictures = [
    "🍎",
    "🍓",
    "🍒",
    "🍊",
    "🍇",
    "🍉",
    "🍍",
    "🥝",
    "🍌",
    "🥕"
];


// CREATE INITIAL SNAKE

function resetGame() {

    snake = [
        {x: 10, y: 12},
        {x: 9, y: 12},
        {x: 8, y: 12}
    ];

    direction = "right";
    nextDirection = "right";

    score = 0;
    points = 0;
    speed = 130;

    gameOver = false;

    updateScore();
    createFood();
    drawGame();
}


// CREATE RANDOM FOOD

function createFood() {

    let validPosition = false;

    while (!validPosition) {

        food = {
            x: Math.floor(Math.random() * SIZE),
            y: Math.floor(Math.random() * SIZE),
            picture: foodPictures[
                Math.floor(Math.random() * foodPictures.length)
            ]
        };

        validPosition = !snake.some(part =>
            part.x === food.x && part.y === food.y
        );
    }
}


// UPDATE SCORE

function updateScore() {

    scoreElement.textContent = score;
    pointsElement.textContent = points;

    if (score > best) {

        best = score;

        localStorage.setItem("snakeBest", best);

        bestElement.textContent = best;
    }
}


// DRAW BACKGROUND

function drawBackground() {

    ctx.fillStyle = "#142b2a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let x = 0; x < SIZE; x++) {

        for (let y = 0; y < SIZE; y++) {

            if ((x + y) % 2 === 0) {

                ctx.fillStyle = "rgba(255,255,255,0.025)";

                ctx.fillRect(
                    x * CELL,
                    y * CELL,
                    CELL,
                    CELL
                );
            }
        }
    }
}


// DRAW SNAKE

function drawSnake() {

    snake.forEach((part, index) => {

        if (index === 0) return;

        ctx.fillStyle = "#36c982";

        ctx.beginPath();

        ctx.roundRect(
            part.x * CELL + 1,
            part.y * CELL + 1,
            CELL - 2,
            CELL - 2,
            6
        );

        ctx.fill();

    });


    // ROTATING SNAKE HEAD IMAGE

    if (headImage.complete && headImage.naturalWidth) {

        const head = snake[0];

        const angles = {
            right: 0,
            down: Math.PI / 2,
            left: Math.PI,
            up: -Math.PI / 2
        };

        ctx.save();

        ctx.translate(
            head.x * CELL + CELL / 2,
            head.y * CELL + CELL / 2
        );

        ctx.rotate(angles[direction]);

        ctx.drawImage(
            headImage,
            -CELL / 2,
            -CELL / 2,
            CELL,
            CELL
        );

        ctx.restore();
    }

}


// DRAW FOOD PICTURE

function drawFood() {

    ctx.font = "19px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        food.picture,
        food.x * CELL + CELL / 2,
        food.y * CELL + CELL / 2
    );

}


// DRAW COMPLETE GAME

function drawGame() {

    drawBackground();
    drawFood();
    drawSnake();

}


// CHANGE DIRECTION

function changeDirection(newDirection) {

    const opposite = {
        up: "down",
        down: "up",
        left: "right",
        right: "left"
    };

    if (newDirection !== opposite[direction]) {

        nextDirection = newDirection;

    }
}


// KEYBOARD CONTROLS

document.addEventListener("keydown", function(event) {

    const keys = {
        ArrowUp: "up",
        w: "up",
        W: "up",

        ArrowDown: "down",
        s: "down",
        S: "down",

        ArrowLeft: "left",
        a: "left",
        A: "left",

        ArrowRight: "right",
        d: "right",
        D: "right"
    };

    if (keys[event.key]) {

        event.preventDefault();

        changeDirection(keys[event.key]);

    }

    if (event.code === "Space") {

        event.preventDefault();

        togglePause();

    }

});


// MOBILE CONTROLS

document.querySelectorAll("[data-dir]").forEach(button => {

    button.addEventListener("pointerdown", function(event) {

        event.preventDefault();

        changeDirection(this.dataset.dir);

    });

});


// MAIN GAME LOOP

function moveSnake() {

    if (!gameRunning || gameOver) return;

    direction = nextDirection;

    const head = {...snake[0]};


    // MOVE SNAKE

    if (direction === "up") head.y--;
    if (direction === "down") head.y++;
    if (direction === "left") head.x--;
    if (direction === "right") head.x++;


    // WALL WRAPPING

    if (head.x < 0) head.x = SIZE - 1;
    if (head.x >= SIZE) head.x = 0;

    if (head.y < 0) head.y = SIZE - 1;
    if (head.y >= SIZE) head.y = 0;


    // CHECK FOOD

    const eating =
        head.x === food.x &&
        head.y === food.y;


    // SELF COLLISION

    const bodyToCheck = eating ? snake : snake.slice(0, -1);

    const collision = bodyToCheck.some(part =>
        part.x === head.x && part.y === head.y
    );

    if (collision) {

        endGame();

        return;

    }


    snake.unshift(head);


    // EAT FOOD

    if (eating) {

        score += 10;
        points += 1;

        updateScore();

        createFood();

        // Increase speed gradually

        if (speed > 65) {

            speed -= 3;

            clearInterval(timer);

            timer = setInterval(moveSnake, speed);

        }

    } else {

        snake.pop();

    }


    drawGame();

}


// START GAME

function startGame() {

    if (gameRunning) return;

    if (gameOver) {

        resetGame();

    }

    gameRunning = true;

    overlay.classList.add("hidden");

    clearInterval(timer);

    timer = setInterval(moveSnake, speed);

}


// PAUSE AND RESUME

function togglePause() {

    if (gameOver) return;

    if (!gameRunning) {

        startGame();

        return;

    }

    gameRunning = false;

    clearInterval(timer);

    overlayTitle.textContent = "PAUSED";

    overlayText.textContent = "Your game is paused.";

    overlayBtn.textContent = "RESUME";

    overlay.classList.remove("hidden");

}


// GAME OVER

function endGame() {

    gameRunning = false;
    gameOver = true;

    clearInterval(timer);

    overlayTitle.textContent = "GAME OVER";

    overlayText.textContent =
        "Your Score: " + score +
        " | Points: " + points;

    overlayBtn.textContent = "PLAY AGAIN";

    overlay.classList.remove("hidden");

}


// RESTART GAME

function restartGame() {

    clearInterval(timer);

    gameRunning = false;

    resetGame();

    startGame();

}


// BUTTON EVENTS

document.getElementById("startBtn")
    .addEventListener("click", startGame);

document.getElementById("pauseBtn")
    .addEventListener("click", togglePause);

document.getElementById("restartBtn")
    .addEventListener("click", restartGame);

overlayBtn.addEventListener("click", function() {

    if (gameRunning) return;

    if (gameOver) {

        resetGame();

    }

    startGame();

});


// INITIALIZE GAME

resetGame();

</script>

</body>
</html>
