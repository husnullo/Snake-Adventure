<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Adventure</title>
<style>
:root {
  --bg: #0f172a;
  --panel: #1e293b;
  --green: #10d6a0;
  --gold: #f4b740;
  --purple: #a56bff;
  --text: #e7edf7;
  --muted: #aab6ca;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 14px 34px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top, #203653 0, var(--bg) 62%);
  color: var(--text);
  font-family: "Trebuchet MS", Arial, sans-serif;
}
.game { width: min(100%, 680px); text-align: center; }
h1 { margin: 0 0 6px; font-size: clamp(30px, 7vw, 46px); letter-spacing: 2px; }
.subtitle { margin: 0 0 22px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
.stat {
  background: rgba(30,41,59,.92); border: 1px solid #354661;
  border-radius: 18px; padding: 13px 6px;
}
.stat span { display:block; color:var(--muted); font-size:12px; letter-spacing:2px; margin-bottom:7px; }
.stat strong { font-size:26px; }
#score { color:#50e6b6; }
#points { color:#ffc857; }
#best { color:#b995ff; }
.board-wrap {
  width: 100%; padding: 12px; border-radius: 25px;
  background: linear-gradient(135deg, #477d70, #294d55);
  box-shadow: 0 0 30px rgba(16,214,160,.13);
}
canvas {
  display:block; width:100%; height:auto; aspect-ratio:1/1;
  border-radius:15px; background:#102b29; touch-action:none;
}
.status { min-height: 28px; margin: 13px 0 10px; color:var(--muted); font-weight:600; }
.controls { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin: 12px 0 18px; }
button {
  border:0; border-radius:15px; padding:16px 20px; min-width:130px;
  font-size:17px; font-weight:800; cursor:pointer; color:#102033;
  box-shadow:0 5px 0 rgba(0,0,0,.16); touch-action: manipulation;
}
button:active { transform:translateY(2px); box-shadow:0 3px 0 rgba(0,0,0,.16); }
#startBtn { background:var(--green); }
#pauseBtn { background:var(--gold); }
#restartBtn { background:var(--purple); color:white; }
.dpad { display:grid; grid-template-columns:repeat(3, minmax(65px, 84px)); grid-template-rows:repeat(2, 70px); gap:9px; justify-content:center; }
.dpad button { min-width:0; padding:8px; border-radius:15px; background:#293b56; color:white; font-size:27px; }
.up { grid-column:2; grid-row:1; }
.left { grid-column:1; grid-row:2; }
.down { grid-column:2; grid-row:2; }
.right { grid-column:3; grid-row:2; }
.help { color:var(--muted); margin-top:18px; line-height:1.5; }
@media (max-width:420px) {
  body { padding:18px 10px 25px; }
  button { min-width:0; flex:1; padding:15px 9px; font-size:15px; }
  .stats { gap:7px; }
  .stat strong { font-size:23px; }
}
</style>
</head>
<body>
<main class="game">
  <h1>🐍 SNAKE ADVENTURE</h1>
  <p class="subtitle">Eat • Grow • Survive</p>

  <section class="stats" aria-label="Game statistics">
    <div class="stat"><span>SCORE</span><strong id="score">0</strong></div>
    <div class="stat"><span>POINTS</span><strong id="points">0</strong></div>
    <div class="stat"><span>BEST</span><strong id="best">0</strong></div>
  </section>

  <div class="board-wrap">
    <canvas id="gameCanvas" width="600" height="600" aria-label="Snake game board"></canvas>
  </div>

  <div class="status" id="status" aria-live="polite">Press START to play!</div>
  <div class="controls">
    <button id="startBtn">▶ START</button>
    <button id="pauseBtn">Ⅱ PAUSE</button>
    <button id="restartBtn">↻ RESTART</button>
  </div>

  <div class="dpad" aria-label="Touch controls">
    <button class="up" data-dir="up" aria-label="Up">⬆️</button>
    <button class="left" data-dir="left" aria-label="Left">⬅️</button>
    <button class="down" data-dir="down" aria-label="Down">⬇️</button>
    <button class="right" data-dir="right" aria-label="Right">➡️</button>
  </div>
  <p class="help">Use ARROW KEYS, WASD, or the buttons to control the snake.<br>Eat the fruit, grow longer, and avoid your own body!</p>
</main>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const pointsEl = document.getElementById("points");
  const bestEl = document.getElementById("best");
  const statusEl = document.getElementById("status");

  const GRID = 25;
  const CELL = canvas.width / GRID;
  const TICK_MS = 125;

  // Different fruit pictures are selected randomly whenever food is spawned.
  const fruits = ["🍎", "🍓", "🍒", "🍊", "🍇", "🍉", "🍍", "🥝", "🍌", "🥕"];
  const directions = {
    up:    { x: 0, y: -1, angle: -Math.PI / 2 },
    right: { x: 1, y: 0, angle: 0 },
    down:  { x: 0, y: 1, angle: Math.PI / 2 },
    left:  { x: -1, y: 0, angle: Math.PI }
  };

  let snake, direction, nextDirection, food;
  let score = 0, points = 0, best = 0;
  let running = false, paused = false, gameOver = false;
  let timer = null;

  try { best = Number(localStorage.getItem("snakeAdventureBest")) || 0; } catch (_) {}
  bestEl.textContent = best;

  function randomCell() {
    return { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
  }

  function spawnFood() {
    let candidate;
    do { candidate = randomCell(); }
    while (snake.some(part => part.x === candidate.x && part.y === candidate.y));
    food = { ...candidate, picture: fruits[Math.floor(Math.random() * fruits.length)] };
  }

  function resetGame() {
    clearInterval(timer);
    snake = [
      { x: 12, y: 12 },
      { x: 11, y: 12 },
      { x: 10, y: 12 }
    ];
    direction = "right";
    nextDirection = "right";
    score = 0;
    points = 0;
    running = false;
    paused = false;
    gameOver = false;
    scoreEl.textContent = score;
    pointsEl.textContent = points;
    statusEl.textContent = "Press START to play!";
    spawnFood();
    draw();
  }

  function startGame() {
    if (gameOver) resetGame();
    if (running && !paused) return;
    running = true;
    paused = false;
    statusEl.textContent = "Good luck! Eat the fruit!";
    clearInterval(timer);
    timer = setInterval(gameStep, TICK_MS);
    draw();
  }

  function togglePause() {
    if (!running || gameOver) return;
    paused = !paused;
    if (paused) {
      clearInterval(timer);
      statusEl.textContent = "Paused — press PAUSE to continue.";
    } else {
      statusEl.textContent = "Keep going!";
      timer = setInterval(gameStep, TICK_MS);
    }
    draw();
  }

  function endGame(message) {
    clearInterval(timer);
    running = false;
    paused = false;
    gameOver = true;
    statusEl.textContent = message + " Press RESTART to play again.";
    draw();
    drawGameOver();
  }

  function setDirection(newDirection) {
    if (!directions[newDirection] || gameOver) return;
    const current = directions[direction];
    const requested = directions[newDirection];
    // Prevent an immediate 180-degree turn into the snake's neck.
    if (requested.x === -current.x && requested.y === -current.y) return;
    nextDirection = newDirection;
    if (!running && !paused) startGame();
  }

  function gameStep() {
    if (!running || paused || gameOver) return;
    direction = nextDirection;
    const vector = directions[direction];
    const head = {
      x: snake[0].x + vector.x,
      y: snake[0].y + vector.y
    };

    // Requirement 2: leaving one edge continues from the opposite edge.
    if (head.x < 0) head.x = GRID - 1;
    if (head.x >= GRID) head.x = 0;
    if (head.y < 0) head.y = GRID - 1;
    if (head.y >= GRID) head.y = 0;

    const eating = head.x === food.x && head.y === food.y;

    // Requirement 9: running into the snake's own body ends the game.
    // Moving into the old tail cell is allowed if the tail moves away this tick.
    const bodyToCheck = eating ? snake : snake.slice(0, -1);
    if (bodyToCheck.some(part => part.x === head.x && part.y === head.y)) {
      endGame("GAME OVER — you hit yourself!");
      return;
    }

    snake.unshift(head);

    if (eating) {
      // Requirements 3 and score tracking: score and points are separate.
      score += 10;
      points += 1;
      scoreEl.textContent = score;
      pointsEl.textContent = points;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem("snakeAdventureBest", String(best)); } catch (_) {}
      }
      spawnFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function drawGrid() {
    ctx.fillStyle = "#102b29";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        if ((x + y) % 2 === 0) {
          ctx.fillStyle = "rgba(255,255,255,0.025)";
          ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
        }
      }
    }
  }

  // Requirement 4/5: draw a bright fruit icon with canvas shapes so it
  // remains visible even on phones that cannot render emoji inside canvas.
  function drawFood() {
    const cx = food.x * CELL + CELL / 2;
    const cy = food.y * CELL + CELL / 2;
    const fruitIndex = fruits.indexOf(food.picture);
    const colors = ["#ff4057", "#ff4f91", "#d92f54", "#ff9f1c", "#8b4bd8", "#ff5263", "#ffb52e", "#73c94b", "#ffd23f", "#ff8a24"];
    const color = colors[Math.max(0, fruitIndex)];
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy + 1, CELL * 0.36, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#6b3d20";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy - CELL * 0.25);
    ctx.lineTo(cx + 2, cy - CELL * 0.48);
    ctx.stroke();
    ctx.fillStyle = "#65e572";
    ctx.beginPath();
    ctx.ellipse(cx + CELL * 0.18, cy - CELL * 0.34, CELL * 0.19, CELL * 0.09, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Requirement 7/8: the head is drawn as a face and rotates with its direction.
  function drawHead(part) {
    const cx = part.x * CELL + CELL / 2;
    const cy = part.y * CELL + CELL / 2;
    const angle = directions[direction].angle;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.fillStyle = "#35d08b";
    ctx.beginPath();
    ctx.roundRect(-10, -9, 20, 18, 7);
    ctx.fill();
    // Eyes are placed toward the front of the rotated head.
    ctx.fillStyle = "#082b25";
    ctx.beginPath();
    ctx.arc(5, -4, 2, 0, Math.PI * 2);
    ctx.arc(5, 4, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawSnake() {
    snake.forEach((part, index) => {
      if (index === 0) {
        drawHead(part);
      } else {
        const inset = 2;
        ctx.fillStyle = index % 2 === 0 ? "#20b978" : "#27c982";
        ctx.beginPath();
        ctx.roundRect(
          part.x * CELL + inset,
          part.y * CELL + inset,
          CELL - inset * 2,
          CELL - inset * 2,
          6
        );
        ctx.fill();
      }
    });
  }

  function drawGameOver() {
    ctx.save();
    ctx.fillStyle = "rgba(5, 12, 22, 0.72)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ff647c";
    ctx.font = "bold 48px 'Trebuchet MS', Arial, sans-serif";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 15);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 22px 'Trebuchet MS', Arial, sans-serif";
    ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 + 35);
    ctx.restore();
  }

  function draw() {
    drawGrid();
    drawFood();
    drawSnake();
    if (paused) {
      ctx.save();
      ctx.fillStyle = "rgba(5,12,22,.58)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.font = "bold 42px 'Trebuchet MS', Arial, sans-serif";
      ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2);
      ctx.restore();
    }
  }

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("pauseBtn").addEventListener("click", togglePause);
  document.getElementById("restartBtn").addEventListener("click", resetGame);

  document.querySelectorAll("[data-dir]").forEach(button => {
    button.addEventListener("click", () => setDirection(button.dataset.dir));
  });

  document.addEventListener("keydown", event => {
    const keyMap = {
      ArrowUp: "up", w: "up", W: "up",
      ArrowRight: "right", d: "right", D: "right",
      ArrowDown: "down", s: "down", S: "down",
      ArrowLeft: "left", a: "left", A: "left"
    };
    if (keyMap[event.key]) {
      event.preventDefault();
      setDirection(keyMap[event.key]);
    } else if (event.code === "Space") {
      event.preventDefault();
      togglePause();
    }
  });

  // Initial state: food is visible before pressing START.
  resetGame();
})();
</script>
</body>
</html>
